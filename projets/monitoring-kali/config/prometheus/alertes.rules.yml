groups:
  - name: disponibilite
    rules:
      - alert: PasserelleInjoignable
        expr: probe_success{job="ping", role="passerelle"} == 0
        for: 1m
        labels: {severite: critique}
        annotations:
          resume: "La box ({{ $labels.instance }}) ne repond plus au ping"
      - alert: InternetInjoignable
        expr: max(probe_success{job="web"}) == 0
        for: 2m
        labels: {severite: critique}
        annotations:
          resume: "Aucun site Internet de reference n'est joignable"
      - alert: DnsBoxEnPanne
        expr: probe_success{job="dns"} == 0
        for: 2m
        labels: {severite: majeure}
        annotations:
          resume: "La box ne resout plus les noms DNS"
      - alert: LatenceElevee
        expr: probe_icmp_duration_seconds{phase="rtt"} > 0.15
        for: 5m
        labels: {severite: mineure}
        annotations:
          resume: "Latence de {{ $value | humanizeDuration }} vers {{ $labels.instance }}"

  - name: sonde
    rules:
      - alert: DisqueSondePlein
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) < 0.15
        for: 5m
        labels: {severite: majeure}
        annotations:
          resume: "Moins de 15 % d'espace libre sur la sonde"
      - alert: MemoireSondeSaturee
        expr: (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) < 0.10
        for: 5m
        labels: {severite: majeure}
        annotations:
          resume: "Moins de 10 % de memoire disponible sur la sonde"
      - alert: ServiceSupervisionArrete
        expr: node_systemd_unit_state{state="active", name=~"(suricata|darkstat|grafana-server|prometheus-blackbox-exporter|arpwatch@.*)\\.service"} == 0
        for: 2m
        labels: {severite: majeure}
        annotations:
          resume: "Le service {{ $labels.name }} est arrete"

  - name: securite
    rules:
      - alert: AlerteIdsGrave
        expr: increase(suricata_alertes_total{severite="1"}[10m]) > 0
        labels: {severite: critique}
        annotations:
          resume: "Suricata a leve {{ $value }} alerte(s) de priorite 1 en 10 minutes"
      - alert: NouvelleMachineSurLeReseau
        expr: increase(reseau_nouvelles_machines_total[1h]) > 0
        labels: {severite: mineure}
        annotations:
          resume: "arpwatch a detecte un nouvel appareil sur le reseau local"
      - alert: ScanDetecte
        expr: increase(suricata_alertes_total{categorie="scan"}[10m]) > 0
        labels: {severite: majeure}
        annotations:
          resume: "Un balayage de ports a ete detecte sur le reseau local"
