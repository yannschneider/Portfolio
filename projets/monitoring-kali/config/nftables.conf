#!/usr/sbin/nft -f
# Pare-feu de la sonde kali-monitor
#  - carte d'administration (eth0, NAT VirtualBox) : SSH et interfaces Web autorises
#  - carte surveillee (__MON_IF__, reseau local) : aucun service expose,
#    seules les reponses aux sondes (ping, nmap, DNS) et le DHCP sont acceptes
flush ruleset

table inet filtre {
  chain entree {
    type filter hook input priority filter; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif "lo" accept
    iifname "eth0" tcp dport { 22, 3000, 3001, 9090 } accept
    iifname "eth0" icmp type echo-request accept
    iifname "__MON_IF__" udp sport 67 udp dport 68 accept
    iifname "__MON_IF__" meta l4proto ipv6-icmp accept
    iifname "__MON_IF__" icmp type { echo-reply, destination-unreachable, time-exceeded } accept
    iifname "__MON_IF__" limit rate 10/minute log prefix "nft-sonde-refuse: " level info
  }
  chain transit {
    type filter hook forward priority filter; policy drop;
  }
  chain sortie {
    type filter hook output priority filter; policy accept;
  }
}
